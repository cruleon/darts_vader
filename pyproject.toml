[project]
name = "dartvision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-contrib-python>=4.8",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.63.0",
]

[project.scripts]
dartvision = "dartvision:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff.lint]
# DTZ: e' un'app locale single-user, i timestamp sono orario locale del
# dispositivo di gioco, non serve consapevolezza del fuso orario.
# C408: lo stile idiomatico di Plotly usa dict(...) per ogni kwarg
# annidato (layout, marker, line, ...): riscriverli come letterali
# richiederebbe virgolette su ogni chiave senza guadagno di leggibilita'.
ignore = ["DTZ", "C408"]
