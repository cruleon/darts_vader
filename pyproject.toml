[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "darts-vader"
version = "1.0.0"
description = "Automatic darts scoring from a single webcam: dartboard detection, learned dart-tip detection and a live x01 web app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
app = [
    "torch>=2.1",
    "torchvision>=0.16",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# torch-free alternative to `app`: use with --tip-backend onnx (see lite/export_onnx.py)
app-onnx = [
    "onnxruntime>=1.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pandas>=2.0",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["darts_vader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
